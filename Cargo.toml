[package]
name = "mackeys"
version = "0.1.0"
edition = "2024"
authors = ["0xstillb"]
license = "MIT"
repository = "https://github.com/0xstillb/mackeys"
description = "คีย์ลัดสไตล์ macOS สำหรับ Windows"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.7.0", features = ["image-data"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.37.0"
image = { version = "0.25.10", features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
